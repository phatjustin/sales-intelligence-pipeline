name: pipeline
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: pipeline
          POSTGRES_PASSWORD: synthetic_test
          POSTGRES_DB: pipeline_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pipeline -d pipeline_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql://pipeline:synthetic_test@localhost:5432/pipeline_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.7'
          python-version: '3.14'
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check src tests scripts integrations
      - run: uv run ruff format --check src tests scripts integrations
      - run: uv run pytest -q
