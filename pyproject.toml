[project]
name = "sales-intelligence-pipeline"
version = "0.1.0"
description = "Synthetic CRM ingestion and PostgreSQL reporting"
requires-python = ">=3.12,<3.15"
dependencies = ["psycopg[binary]==3.2.13", "pydantic==2.12.4"]

[project.scripts]
sales-pipeline = "sales_pipeline.cli:main"

[project.optional-dependencies]
dev = ["pytest==9.0.1", "ruff==0.14.5"]

[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sales_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: real PostgreSQL"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["sales_pipeline", "sales_intelligence"]
